<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Gallery | メタセコイア 公式ポータル</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
      margin: 0;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    header {
      padding: 20px 0;
      border-bottom: 2px solid #334155;
      margin-bottom: 20px;
    }
    h1 {
      color: #38bdf8;
      font-size: 1.4rem;
      margin: 0;
    }
    .image-container {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #38bdf8;
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1>Visual Gallery</h1>
  </header>

  <main>
    <div class="image-container">
      <img src="./IMG_0263.png" alt="メタセコイアのイラスト">
    </div>
    
    <p><a href="./" class="back-link">← トップページに戻る</a></p>
  </main>

</body>
</html>
